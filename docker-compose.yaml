# nginx proxy address - http://172.17.0.1:5000

name: kavita
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "5m"
    max-file: "1"

services:
  kavita:
    image: jvmilazz0/kavita:latest
    pull_policy: always
    container_name: kavita-app
    restart: always
    logging: *default-logging
    networks:
      - kavita
    ports:
      - "172.17.0.1:5000:5000"
    environment:
      TZ: ${TZ:-America/New_York}
      PUID: ${SERVICE_USER:-1000}
      PGID: ${SERVICE_GROUP:-1000}
    volumes:
      - ./volumes/config/kavita:/config
      - ./volumes/data/kavita:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  kavita:
    name: kavita
    external: false
